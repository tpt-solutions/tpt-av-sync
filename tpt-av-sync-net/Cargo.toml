[package]
name = "tpt-av-sync-net"
description = "Network transport and replication engine for tpt-av-sync (TCP, WebSocket, optional WebRTC)"
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["network", "webrtc", "websocket", "collaboration"]
categories = ["network-programming"]

[features]
default = ["websocket"]
websocket = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
webrtc = ["dep:webrtc", "dep:tokio", "dep:futures-util", "dep:bytes"]
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rcgen", "dep:rustls-pemfile", "dep:tokio"]
mdns = ["dep:mdns-sd"]

[dependencies]
tpt-av-sync-utils = { workspace = true }
tpt-av-sync-crdt = { workspace = true }
tpt-av-sync-playhead = { workspace = true }
tpt-av-sync-presence = { workspace = true }
serde = { workspace = true }
socket2 = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
webrtc = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
mdns-sd = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
