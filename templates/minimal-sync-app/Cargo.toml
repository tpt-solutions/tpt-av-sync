[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned to a branch/tag rather than a path so a generated project builds
# standalone. Once the crates are on crates.io, switch these to normal
# version dependencies instead.
tpt-av-sync-utils = { git = "https://github.com/tpt-solutions/tpt-av-sync", branch = "main" }
tpt-av-sync-crdt = { git = "https://github.com/tpt-solutions/tpt-av-sync", branch = "main" }
tpt-av-sync-net = { git = "https://github.com/tpt-solutions/tpt-av-sync", branch = "main" }
tpt-av-sync-playhead = { git = "https://github.com/tpt-solutions/tpt-av-sync", branch = "main" }
tpt-av-sync-presence = { git = "https://github.com/tpt-solutions/tpt-av-sync", branch = "main" }
