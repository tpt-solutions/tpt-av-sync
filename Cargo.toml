[workspace]
resolver = "2"
members = [
    "tpt-av-sync-utils",
    "tpt-av-sync-crdt",
    "tpt-av-sync-net",
    "tpt-av-sync-playhead",
    "tpt-av-sync-presence",
    "tpt-av-sync-server",
    "tpt-av-sync-cli",
    "examples",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-av-sync"
rust-version = "1.75"
authors = ["TPT Solutions"]

[workspace.dependencies]
# Internal crates.
tpt-av-sync-utils = { path = "tpt-av-sync-utils", version = "0.1.0" }
tpt-av-sync-crdt = { path = "tpt-av-sync-crdt", version = "0.1.0" }
tpt-av-sync-net = { path = "tpt-av-sync-net", version = "0.1.0" }
tpt-av-sync-playhead = { path = "tpt-av-sync-playhead", version = "0.1.0" }
tpt-av-sync-presence = { path = "tpt-av-sync-presence", version = "0.1.0" }
tpt-av-sync-server = { path = "tpt-av-sync-server", version = "0.1.0" }

# Networking (permissive-licensed only — see deny.toml).
tokio = { version = "1.37", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", default-features = false }
bytes = "1.6"
socket2 = "0.5"

# Security (Phase 7).
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls-pemfile = "2.1"
webrtc = { version = "0.11" }

# Serialization.
serde = { version = "1.0.184", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2.0", features = ["serde"] }

# Misc.
log = "0.4"

# CLI tooling (Phase 9).
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"

# Dev / test.
proptest = "1.4"
criterion = "0.5"

[workspace.lints.rust]
missing_docs = "deny"

[profile.bench]
debug = true
