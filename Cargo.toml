[workspace]
resolver = "2"
members = [
    "tpt-av-sync-utils",
    "tpt-av-sync-crdt",
    "tpt-av-sync-net",
    "tpt-av-sync-playhead",
    "tpt-av-sync-presence",
    "tpt-av-sync-server",
    "examples",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-av-sync"
rust-version = "1.75"
authors = ["TPT Solutions Open Source <opensource@tptsolutions.co.nz>"]

[workspace.dependencies]
# Internal crates.
tpt-av-sync-utils = { path = "tpt-av-sync-utils", version = "0.1.0" }
tpt-av-sync-crdt = { path = "tpt-av-sync-crdt", version = "0.1.0" }
tpt-av-sync-net = { path = "tpt-av-sync-net", version = "0.1.0" }
tpt-av-sync-playhead = { path = "tpt-av-sync-playhead", version = "0.1.0" }
tpt-av-sync-presence = { path = "tpt-av-sync-presence", version = "0.1.0" }

# Networking (permissive-licensed only — see deny.toml).
tokio = { version = "1.37", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", default-features = false }
bytes = "1.6"
socket2 = "0.5"
webrtc = { version = "0.11" }

# Serialization.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Misc.
log = "0.4"

# Dev / test.
proptest = "1.4"
criterion = "0.5"

[workspace.lints.rust]
missing_docs = "deny"

[profile.bench]
debug = true
